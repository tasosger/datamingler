services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/12345678
    ports:
      - "7474:7474"   # browser UI (optional — remove if you don't need it)
      - "7687:7687"   # bolt (optional — remove if you don't need it)

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
      - neo4j
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "12345678"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8080:8080"   # optional — only needed if you want to call the API directly

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PYTHON_API_URL: http://backend:8080
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
