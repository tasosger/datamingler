[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "datamingler"
version = "0.1.0"
description = "Clean Python implementation of the DataMingler DVM/query engine."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "DataMingler maintainers" }]
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
db = ["sqlalchemy>=2.0"]
neo4j = ["neo4j>=5.0"]
dev = ["pytest>=8.0"]

[project.scripts]
datamingler = "datamingler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["datamingler*"]
